{% extends "base.html" %}
{% block title %}Login — Receipt Sorter{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:80vh;">
  <div class="card shadow border-secondary" style="width:100%;max-width:380px;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-receipt-cutoff text-warning" style="font-size:2.5rem;"></i>
        <h4 class="mt-2 fw-semibold">Receipt Sorter</h4>
        <p class="text-muted small">Gmail → Google Drive, powered by Claude</p>
      </div>
      <form method="post">
        <div class="mb-3">
          <label class="form-label small text-muted">Password</label>
          <input type="password" name="password" class="form-control" autofocus placeholder="Enter password">
        </div>
        <button class="btn btn-warning w-100 fw-semibold" type="submit">
          <i class="bi bi-unlock me-1"></i>Sign In
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
